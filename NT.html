<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Axis Browser — new tab.">
  <title>Axis</title>
  <link rel="icon" href="https://raw.githubusercontent.com/viroda1/Axis/refs/heads/main/Untitled%20design%20(1).svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #030304;
      --surface: rgba(255,255,255,0.03);
      --surface-hover: rgba(255,255,255,0.05);
      --text: #FFFFFF;
      --text-muted: #94a3b8;
      --text-weakest: #475569;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99,102,241,0.15);
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.12);
    }

    html, body {
      min-height: 100vh;
      width: 100%;
      background-color: var(--bg);
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      transition: background 0.5s ease;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Background layers */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 50% at 50% 40%, black 20%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 40%, black 20%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      filter: blur(140px);
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
      animation: pulse-glow 6s ease-in-out infinite;
    }

    .bg-glow-2 {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      bottom: -150px;
      right: -100px;
      background: #a855f7;
      filter: blur(120px);
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
      animation: pulse-glow 8s ease-in-out infinite 2s;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.04; }
      50% { opacity: 0.08; }
    }

    /* Panel */
    .glass-panel {
      position: relative;
      z-index: 1;
      width: 92%;
      max-width: 640px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px 32px 32px;
      text-align: center;
      animation: panel-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo */
    .logo-area {
      margin-bottom: 8px;
    }

    .logo-area img {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 0 16px rgba(99,102,241,0.25));
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Title */
    .brand-title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #FFFFFF 0%, #818cf8 50%, #c084fc 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 8s ease infinite;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Clock */
    .time-container { margin: 24px 0 28px; }

    .clock {
      font-size: 48px;
      font-weight: 300;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }

    .date {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      color: var(--text-weakest);
    }

    /* Search */
    .search-container {
      display: flex;
      align-items: center;
      width: 100%;
      position: relative;
      margin-bottom: 32px;
    }

    .search-bar {
      width: 100%;
      height: 46px;
      padding: 0 110px 0 44px;
      font-size: 14px;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: all 0.3s ease;
      text-align: left;
    }

    .search-bar::placeholder { color: var(--text-weakest); }

    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(255,255,255,0.04);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-weakest);
      font-size: 14px;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .search-bar:focus ~ .search-icon { color: var(--accent-light); }

    #engine {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      height: 34px;
      padding: 0 12px;
      background: var(--surface-hover);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11px;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    #engine:hover { border-color: var(--border-hover); color: var(--text); }

    /* Shortcuts */
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
      gap: 12px;
      width: 100%;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shortcut:hover { transform: translateY(-4px); }

    .shortcut-icon {
      width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: var(--surface);
      color: var(--text-muted);
      transition: all 0.25s ease;
    }

    .shortcut:hover .shortcut-icon {
      border-color: var(--border-hover);
      background: var(--surface-hover);
      box-shadow: 0 0 20px rgba(99,102,241,0.08);
    }

    .shortcut-icon img {
      width: 22px;
      height: 22px;
      border-radius: 4px;
    }

    .shortcut-label {
      color: var(--text-weakest);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.2;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Quote */
    .quote {
      color: var(--text-weakest);
      margin-top: 28px;
      font-size: 12px;
      font-style: italic;
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    /* Loader */
    .loader {
      position: fixed;
      inset: 0;
      background: rgba(3,3,4,0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      gap: 16px;
    }

    .loader.show { display: flex; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      font-size: 12px;
      color: var(--text-weakest);
      font-weight: 400;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .axis-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(5,5,7,0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 13px;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      animation: toast-in 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
      pointer-events: auto;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(8px) scale(0.96); }
    }

    /* Add Shortcut Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 24px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      background: #050507;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      transform: scale(0.96) translateY(8px);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    .modal-field {
      margin-bottom: 14px;
    }

    .modal-field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-weakest);
      margin-bottom: 6px;
    }

    .modal-field input {
      width: 100%;
      height: 40px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: 'Inter', system-ui, sans-serif;
      outline: none;
      transition: all 0.2s ease;
    }

    .modal-field input::placeholder { color: var(--text-weakest); }
    .modal-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', system-ui, sans-serif;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .modal-btn-cancel {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .modal-btn-cancel:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .modal-btn-confirm {
      background: var(--text);
      color: #000;
    }

    .modal-btn-confirm:hover {
      background: #e2e8f0;
    }

    @media (max-width: 480px) {
      .glass-panel { padding: 28px 20px 24px; }
      .clock { font-size: 36px; }
      .brand-title { font-size: 22px; }
      .shortcuts { gap: 10px; grid-template-columns: repeat(auto-fit, minmax(56px, 1fr)); }
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <span class="loader-text">Navigating...</span>
  </div>

  <div class="glass-panel">
    <div class="logo-area">
      <img src="https://raw.githubusercontent.com/viroda1/Axis/refs/heads/main/Untitled%20design%20(1).svg" alt="Axis">
    </div>
    <div class="brand-title">Axis</div>

    <div class="time-container">
      <div class="clock" id="clock">00:00</div>
      <div class="date" id="date">Loading...</div>
    </div>

    <form class="search-container" id="searchForm">
      <input type="text" id="searchInput" class="search-bar" placeholder="Search the web..." autocomplete="off">
      <i class="fa-solid fa-arrow-right search-icon"></i>
      <select id="engine">
        <option value="https://search.brave.com/search?q=">Brave</option>
        <option value="https://duckduckgo.com/?q=">DDG</option>
        <option value="https://www.google.com/search?igu=1&q=">Google</option>
      </select>
    </form>

    <div class="shortcuts" id="shortcuts">
      <a class="shortcut" data-url="https://crazygames.com">
        <div class="shortcut-icon"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSS2Kuc0ZioZ0Vti_KtXEWpAuV61bYp16qfKA&s" alt="CrazyGames"></div>
        <span class="shortcut-label">CrazyGames</span>
      </a>
      <a class="shortcut" data-url="https://youtube.com">
        <div class="shortcut-icon"><img src="https://www.youtube.com/favicon.ico" alt="YouTube"></div>
        <span class="shortcut-label">YouTube</span>
      </a>
      <a class="shortcut" data-url="https://open.spotify.com/">
        <div class="shortcut-icon"><img src="https://favicon.run/favicon?domain=open.spotify.com&sz=256" alt="Spotify"></div>
        <span class="shortcut-label">Spotify</span>
      </a>
      <a class="shortcut" data-url="https://pluto.tv/">
        <div class="shortcut-icon"><img src="https://cdn.theorg.com/a250f7c7-8d93-487f-bc35-69a5e2145115_medium.jpg" alt="Pluto TV"></div>
        <span class="shortcut-label">Pluto TV</span>
      </a>
      <a class="shortcut" href="/internal/games.html">
        <div class="shortcut-icon"><img src="https://pgis3.vercel.app/assets/games.png" alt="Games"></div>
        <span class="shortcut-label">Games</span>
      </a>
      <div id="customShortcuts" style="display:contents;"></div>

      <div class="shortcut" id="uploadBtn">
        <div class="shortcut-icon"><i class="fa-solid fa-image"></i></div>
        <span class="shortcut-label">Set BG</span>
      </div>
      <div class="shortcut" id="resetBtn">
        <div class="shortcut-icon"><i class="fa-solid fa-rotate-left"></i></div>
        <span class="shortcut-label">Reset BG</span>
      </div>
      <div class="shortcut" id="addShortcut">
        <div class="shortcut-icon"><i class="fa-solid fa-plus"></i></div>
        <span class="shortcut-label">Add</span>
      </div>
    </div>

    <div class="quote" id="quote"></div>
  </div>

  <input type="file" id="bgUpload" accept="image/*" style="display:none;">

  <!-- Add Shortcut Modal -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <h3>Add Shortcut</h3>
      <div class="modal-field">
        <label>Name</label>
        <input type="text" id="modalName" placeholder="My Site" maxlength="20">
      </div>
      <div class="modal-field">
        <label>URL</label>
        <input type="text" id="modalUrl" placeholder="https://example.com">
      </div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="modalCancel">Cancel</button>
        <button class="modal-btn modal-btn-confirm" id="modalConfirm">Add</button>
      </div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const bgUpload = $('#bgUpload');

    // Toast
    function showToast(message, icon = 'fa-circle-check', color = '#10b981') {
      const existing = document.querySelector('.axis-toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'axis-toast';
      toast.innerHTML = `<i class="fa-solid ${icon}" style="color:${color};font-size:14px;"></i><span>${message}</span>`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'toast-out 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Proxy Navigation
    const nav = url => {
      $('#loader').classList.add('show');
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'navigate', url }, '*');
      } else {
        window.location.href = url;
      }
    };

    // Background
    function loadBackground() {
      const savedBg = localStorage.getItem('axisCustomBg');
      document.body.style.backgroundImage = savedBg ? `url(${savedBg})` : 'none';
    }
    loadBackground();

    // Clock
    function updateClock() {
      const now = new Date();
      $('#clock').textContent = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      $('#date').textContent = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Search
    $('#searchForm').onsubmit = e => {
      e.preventDefault();
      const q = $('#searchInput').value.trim();
      if (q) nav($('#engine').value + encodeURIComponent(q));
    };

    // Shortcuts click handler
    $('#shortcuts').onclick = e => {
      const shortcut = e.target.closest('.shortcut[data-url]');
      const addBtn = e.target.closest('#addShortcut');
      const uploadBtn = e.target.closest('#uploadBtn');
      const resetBtn = e.target.closest('#resetBtn');

      if (shortcut) {
        nav(shortcut.dataset.url);
      } else if (uploadBtn) {
        bgUpload.click();
      } else if (resetBtn) {
        localStorage.removeItem('axisCustomBg');
        loadBackground();
        showToast('Background reset', 'fa-rotate-left', '#818cf8');
      } else if (addBtn) {
        openAddModal();
      }
    };

    // Background upload
    bgUpload.onchange = e => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = event => {
          const imgData = event.target.result;
          document.body.style.backgroundImage = `url(${imgData})`;
          try {
            localStorage.setItem('axisCustomBg', imgData);
            showToast('Background set', 'fa-image', '#818cf8');
          } catch (err) {
            showToast('Image too large — try a smaller file', 'fa-circle-exclamation', '#ef4444');
          }
        };
        reader.readAsDataURL(file);
      }
    };

    // Custom shortcuts
    function renderCustom() {
      const container = $('#customShortcuts');
      container.innerHTML = '';
      const shortcuts = JSON.parse(localStorage.getItem('axisShortcuts') || '[]');
      shortcuts.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'shortcut';
        div.dataset.url = s.url;
        div.innerHTML = `
          <div class="shortcut-icon"><i class="fa-solid fa-link"></i></div>
          <span class="shortcut-label">${s.name}</span>
        `;
        // Right-click to remove
        div.addEventListener('contextmenu', e => {
          e.preventDefault();
          shortcuts.splice(i, 1);
          localStorage.setItem('axisShortcuts', JSON.stringify(shortcuts));
          renderCustom();
          showToast('Shortcut removed', 'fa-trash', '#ef4444');
        });
        container.appendChild(div);
      });
    }

    // Add Shortcut Modal
    function openAddModal() {
      $('#addModal').classList.add('active');
      $('#modalName').value = '';
      $('#modalUrl').value = '';
      setTimeout(() => $('#modalName').focus(), 100);
    }

    function closeAddModal() {
      $('#addModal').classList.remove('active');
    }

    $('#modalCancel').onclick = closeAddModal;
    $('#addModal').onclick = e => { if (e.target === $('#addModal')) closeAddModal(); };

    $('#modalConfirm').onclick = () => {
      const name = $('#modalName').value.trim();
      let url = $('#modalUrl').value.trim();
      if (!name || !url) {
        showToast('Please fill in both fields', 'fa-circle-exclamation', '#ef4444');
        return;
      }
      if (!url.startsWith('http')) url = 'https://' + url;
      const shortcuts = JSON.parse(localStorage.getItem('axisShortcuts') || '[]');
      shortcuts.push({ name, url });
      localStorage.setItem('axisShortcuts', JSON.stringify(shortcuts));
      renderCustom();
      closeAddModal();
      showToast(`${name} added`, 'fa-circle-check', '#10b981');
    };

    // Enter key in modal
    ['modalName', 'modalUrl'].forEach(id => {
      $(`#${id}`).addEventListener('keydown', e => {
        if (e.key === 'Enter') $('#modalConfirm').click();
        if (e.key === 'Escape') closeAddModal();
      });
    });

    // Quotes
    const quotes = [
      "Browse freely.",
      "Built for speed.",
      "No traces left behind.",
      "Your web, your rules.",
      "Fast. Private. Axis.",
      "Lightweight by design.",
      "The open web, unlocked."
    ];
    $('#quote').textContent = '"' + quotes[Math.floor(Math.random() * quotes.length)] + '"';

    renderCustom();
  </script>
</body>
</html>
