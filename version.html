<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://raw.githubusercontent.com/viroda1/Axis/refs/heads/main/Untitled%20design%20(1).svg" type="image/svg+xml">
<title>Axis — Version</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #030304;
    --surface: rgba(255,255,255,0.03);
    --surface-hover: rgba(255,255,255,0.05);
    --text: #FFFFFF;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --text-weakest: #475569;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --accent-glow: rgba(99,102,241,0.15);
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.6;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 60% 50% at 50% 30%, black 20%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 30%, black 20%, transparent 100%);
    pointer-events: none;
  }

  .bg-glow {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    filter: blur(140px);
    opacity: 0.06;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    animation: fade-in 0.6s ease-out;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .page-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .page-header img {
    width: 36px;
    height: 36px;
    filter: drop-shadow(0 0 12px rgba(99,102,241,0.25));
  }

  .page-header h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .page-subtitle {
    color: var(--text-weakest);
    font-size: 13px;
    margin-bottom: 40px;
    padding-left: 50px;
  }

  .version-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--accent-glow);
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent-light);
    margin-bottom: 32px;
  }

  .version-badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-light);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .info-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    transition: background 150ms ease;
    gap: 16px;
  }

  .row:last-child {
    border-bottom: none;
  }

  .row:hover {
    background: var(--surface-hover);
  }

  .label {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .label i {
    width: 14px;
    text-align: center;
    font-size: 11px;
    color: var(--text-weakest);
  }

  .value {
    text-align: right;
    font-size: 13px;
    color: var(--text-muted);
    max-width: 60%;
    word-break: break-word;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    line-height: 1.5;
  }

  .value.text {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    font-weight: 400;
  }

  .value.accent {
    color: var(--accent-light);
  }

  .footer {
    margin-top: 32px;
    text-align: center;
    color: var(--text-weakest);
    font-size: 11px;
    letter-spacing: 0.02em;
  }

  .footer a {
    color: var(--text-dim);
    text-decoration: none;
    transition: color 150ms ease;
  }

  .footer a:hover {
    color: var(--accent-light);
  }

  @media (max-width: 480px) {
    .container { padding: 40px 16px 60px; }
    .row { padding: 12px 14px; }
    .value { max-width: 55%; font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="container">
    <div class="page-header">
      <img src="https://raw.githubusercontent.com/viroda1/Axis/refs/heads/main/Untitled%20design%20(1).svg" alt="Axis">
      <h1>Version Info</h1>
    </div>
    <p class="page-subtitle">Technical details about this Axis installation</p>

    <div class="version-badge">
      <span class="dot"></span>
      v1.5.0 Stable
    </div>

    <div class="info-card">
      <div class="row">
        <span class="label"><i class="fa-solid fa-tag"></i> Version</span>
        <span class="value accent">1.5.0 Stable</span>
      </div>

      <div class="row">
        <span class="label"><i class="fa-solid fa-hammer"></i> Build</span>
        <span class="value">2026.07.17</span>
      </div>

      <div class="row">
        <span class="label"><i class="fa-solid fa-gear"></i> Engine</span>
        <span class="value text">Scramjet + Wisp</span>
      </div>

      <div class="row">
        <span class="label"><i class="fa-solid fa-robot"></i> User Agent</span>
        <span class="value" id="ua">Loading...</span>
      </div>

      <div class="row">
        <span class="label"><i class="fa-solid fa-scale-balanced"></i> License</span>
        <span class="value text">MIT</span>
      </div>

      <div class="row">
        <span class="label"><i class="fa-solid fa-calendar"></i> Build Date</span>
        <span class="value text">July 17, 2026</span>
      </div>

      <div class="row">
        <span class="label"><i class="fa-solid fa-fingerprint"></i> Browser ID</span>
        <span class="value" id="browserID">Generating...</span>
      </div>

      <div class="row">
        <span class="label"><i class="fa-solid fa-code"></i> Developer</span>
        <span class="value text">0800</span>
      </div>
    </div>

    <div class="footer">
      <a href="axis://about">About Axis</a> · <a href="axis://changelog">Changelog</a>
    </div>
  </div>

  <script>
    document.getElementById("ua").textContent = navigator.userAgent;

    let id = localStorage.getItem("axisID");

    if (!id) {
      id = "axis-" + Math.random().toString(36).substring(2, 8);
      localStorage.setItem("axisID", id);

      // Migrate old zinc ID if exists
      const oldId = localStorage.getItem("zincID");
      if (oldId) {
        id = "axis-" + oldId.replace("zinc-", "");
        localStorage.setItem("axisID", id);
        localStorage.removeItem("zincID");
      }
    }

    document.getElementById("browserID").textContent = id;
  </script>
</body>
</html>
